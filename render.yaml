services:
  - type: web
    name: webrtc-signaling-api
    env: python
    runtime: python-3.11
    plan: free
    buildCommand: pip install -r requirements.txt
    # WebSocket signaling keeps connection + room state in-memory per process,
    # so this MUST run as a single worker. Multiple workers break signaling.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    
    # Environment Variables
    envVars:
      - key: API_KEY
        sync: false  # Set this manually in Render dashboard for security
      
      - key: ALLOWED_ORIGINS
        value: "*"
        # For production, replace with your domain:
        # value: "https://yourdomain.com,https://app.yourdomain.com"
      
      - key: ROOM_TTL_HOURS
        value: "24"
      
      - key: MAX_PARTICIPANTS_PER_ROOM
        value: "50"
      
      - key: DATA_FILE
        value: "data/rooms.json"

    # NOTE: Render's free plan does not support persistent disks, so none is
    # attached here. Room data lives on ephemeral storage and is reset on
    # redeploy/restart — fine for signaling, since rooms are short-lived (TTL).
    # To persist rooms, upgrade the plan and add a `disk:` block mounted at
    # /opt/render/project/src/data.
